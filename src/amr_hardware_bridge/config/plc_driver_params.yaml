plc_driver_node:
  ros__parameters:
    # ── Koneksi PLC ──────────────────────────────────────────────────────────
    plc_host: '192.168.3.250'
    plc_port: 5007
    cycle_hz: 20.0
    reconnect_s: 2.0
    # ── Parameter Mekanikal Roda ──────────────────────────────────────────────
    wheel_diameter_m: 0.110
    wheel_separation_m: 0.240
    ticks_per_rev: 360000.0
    gear_ratio: 1.0
    # ── Batas Kecepatan ───────────────────────────────────────────────────────
    speed_max: 250
    speed_min: -250
    # ── Keamanan Hardware ─────────────────────────────────────────────────────
    zero_crossing_cooldown_s: 0.0
    jump_filter_m: 5.0
    # ── Register Encoder ─────────────────────────────────────────────────────
    enc_head: 'D40'
    enc_read_size: 102
    left_lo_idx: 0
    left_hi_idx: 1
    right_lo_idx: 100
    right_hi_idx: 101
    # ── Register Motor CMD ────────────────────────────────────────────────────
    # KOREKSI INVERSI: register ditukar di sini
    cmd_right_head: 'D161'
    cmd_left_head: 'D61'
    heartbeat_head: 'M211'
    servo_lock_head: 'M220'
    # ── Register Virtual Line (section ROS VIRTUAL LINE di ladder) ───────────
    vl_cte_head:      'D310'   # input CTE ke PID PLC
    vl_mode_bit:      'M230'   # 1=mode ROS virtual, 0=magnetic fisik
    vl_heartbeat_bit: 'M231'   # toggle tiap cycle sebagai watchdog
    vl_gate_bit:      'M236'   # 1=motor stop paksa, 0=motor boleh jalan
