amcl:
  ros__parameters:
    use_sim_time: false
    transform_tolerance: 1.0
    save_pose_rate: 0.5
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    default_bt_xml_filename: "/home/eqdev/amr_mp/install/amr_mp_bringup/share/amr_mp_bringup/config/amr_nav_tree.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.05
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.05
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      # Diturunkan 15 -> 10: hentikan pivot futile lebih cepat, picu recovery.
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      # DINAIKKAN 0.20 -> 0.30. Lever utama untuk mode campuran: robot
      # menyatakan "sampai" sebelum perlu pivot presisi terminal yang memicu
      # stall. Robot mendekat dengan kurva, lalu selesai tanpa berputar.
      xy_goal_tolerance: 0.30
      # Bebas hadap mana saja saat goal tercapai.
      yaw_goal_tolerance: 3.14

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      # min_vel_x tetap 0.0: rotasi di tempat TETAP diizinkan untuk kasus
      # robot harus berbalik tajam (mode campuran).
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.6
      max_vel_y: 0.0
      # Diturunkan 0.8 -> 0.7: batasi permintaan rotasi DWB agar overshoot
      # pivot lebih kecil.
      max_vel_theta: 0.7
      min_speed_xy: 0.0
      min_speed_theta: 0.0
      max_speed_xy: 0.6
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -1.5
      decel_lim_y: 0.0
      decel_lim_theta: -1.0

      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.5

      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      # Samakan dengan goal_checker.
      xy_goal_tolerance: 0.30
      trans_stopped_velocity: 0.10
      short_circuit_trajectory_evaluation: true
      stateful: true

      # GoalAlign & RotateToGoal sengaja tidak disertakan.
      critics: ["BaseObstacle", "PathAlign", "PathDist", "GoalDist"]

      BaseObstacle.scale: 0.05
      # PathAlign diturunkan 12 -> 8: kurangi dorongan meluruskan diri ke
      # jalur (penyebab pivot) agar robot lebih memilih melengkung maju.
      PathAlign.scale: 8.0
      PathAlign.forward_point_distance: 0.1
      PathDist.scale: 24.0
      # GoalDist dominan: prioritas mencapai titik XY, bukan orientasi.
      GoalDist.scale: 24.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: false
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # Footprint persegi panjang menggantikan robot_radius lingkaran.
      # Polebot ~40cm (lebar) x ~50cm (panjang). base_footprint diasumsikan
      # di PUSAT geometris sasis. Margin keamanan 2cm tiap sisi.
      footprint: "[ [0.25, 0.22], [0.25, -0.22], [-0.18, -0.22], [-0.18, 0.22] ]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 15.0
        inflation_radius: 0.15
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.30
          obstacle_max_range: 2.5
          obstacle_min_range: 0.30
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: false
      # Footprint persegi panjang (sama dgn local costmap).
      footprint: "[ [0.25, 0.22], [0.25, -0.22], [-0.18, -0.22], [-0.18, 0.22] ]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.30
          obstacle_max_range: 2.5
          obstacle_min_range: 0.30
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 15.0
        # DITURUNKAN 0.30 -> 0.25: buka ruang di global costmap juga.
        inflation_radius: 0.25
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    recovery_plugins: ["back_up", "wait"]
    back_up:
      plugin: "nav2_recoveries/BackUp"
      speed: 0.25
    wait:
      plugin: "nav2_recoveries/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_timeout: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.4
    rotational_acc_lim: 1.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200
